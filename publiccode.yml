description:
  en-GB:
    shortDescription: Young people not in work, learning or training, and every UK response, each claim sourced. Prototype.
    longDescription: >-
      A single-page portal in 38 parts for young people aged 16 to 24, and the people helping them: a personal plan,
      17 routes into work, learning, training and self-employment, the Milburn Review, the duties, programmes and
